# 同一オリジン構成の入口。/api と /sanctum をLaravelへ、それ以外をNext.jsへ振り分ける。
# フロントとAPIが同じホスト・同じポートになるためCORSが不要になり、
# Sanctumのセッションクッキーもクロスサイト扱いにならない（iOSのSameSite制約を回避できる）。

upstream php {
    server backend:9000;
}

upstream nextjs {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # 画像添付は5MBまで。PHP側のupload_max_filesizeと揃える
    client_max_body_size 6M;

    # --- Laravel（API・CSRFクッキー・ヘルスチェック） ---
    # Laravelはすべてのリクエストをpublic/index.phpで受けるため、ファイルの存在確認は不要。
    # nginx側にアプリのファイルを置かなくて済むよう、FastCGIへ直接渡す
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # Cloudflare Tunnelで終端されるため、アプリにはhttpsとして伝える
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        # 画像のストリーミング配信があるため短すぎない値にする
        fastcgi_read_timeout 60s;
    }

    # --- Next.js（それ以外すべて） ---
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
