# 本番用（AWS EC2 t4g.micro + Cloudflare Tunnel）。
# 開発用のdocker-compose.ymlとは別物。ソースのbind mountはせず、イメージに焼き込む。
#
# ホストにポートを一切公開しない。外部からの到達はCloudflare Tunnelの
# アウトバウンド接続経由のみで、EC2のセキュリティグループはインバウンド全閉じにできる。

services:
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - './docker/nginx/kakeibo.conf:/etc/nginx/conf.d/default.conf:ro'
        depends_on:
            - backend
            - frontend
        networks:
            - kakeibo

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        networks:
            - kakeibo

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        env_file:
            - ./backend/.env
        volumes:
            # 添付画像の保存先（storage/app/private）。コンテナを作り直しても消えないようにする
            - 'kakeibo-storage:/var/www/html/storage/app'
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - kakeibo

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'kakeibo-mysql:/var/lib/mysql'
            - './docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_ROOT_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - kakeibo

    cloudflared:
        image: 'cloudflare/cloudflared:latest'
        restart: unless-stopped
        # インバウンドを開けずに公開するため、cloudflared側から外へ繋ぐ
        command: 'tunnel --no-autoupdate run'
        environment:
            TUNNEL_TOKEN: '${TUNNEL_TOKEN}'
        depends_on:
            - nginx
        networks:
            - kakeibo

networks:
    kakeibo:
        driver: bridge

volumes:
    kakeibo-mysql:
        driver: local
    kakeibo-storage:
        driver: local
